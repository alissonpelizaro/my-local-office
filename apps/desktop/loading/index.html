<!doctype html>
<!-- Shown while the office server starts; the app then navigates the window to it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>My Local Office</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; font: 14px -apple-system, system-ui, sans-serif; color: #71717a; background: #fafafa; }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #a1a1aa; } }
      .failed { display: none; max-width: 28rem; text-align: center; line-height: 1.5; }
      body[data-failed] .starting { display: none; }
      body[data-failed] .failed { display: block; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <p class="starting">Starting the office…</p>
    <p class="failed">The office server did not start. See <code>~/.my-local-office/data/office.log</code>, then reopen the app.</p>
  </body>
</html>
