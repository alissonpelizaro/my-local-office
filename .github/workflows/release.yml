name: Release

# When a release is published: build the desktop app per platform (.app/.dmg, .AppImage/.deb) and the headless
# packages (app + bundled Node), attach them, install.sh and uninstall.sh to the release, then install the
# published release on macOS (app) and Linux (headless) and check the office starts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)build, e.g. v1.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash scripts/build-release.sh "$TAG"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, rust: aarch64-apple-darwin, target: darwin-arm64, bundles: 'app,dmg' }
          - { runner: macos-latest, rust: x86_64-apple-darwin, target: darwin-x64, bundles: 'app,dmg' }
          - { runner: ubuntu-22.04, rust: x86_64-unknown-linux-gnu, target: linux-x64, bundles: 'appimage,deb' }
          - { runner: ubuntu-22.04-arm, rust: aarch64-unknown-linux-gnu, target: linux-arm64, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash scripts/stage-app.sh apps/desktop/src-tauri/app "$TAG" ${{ matrix.target }}
      - name: Build the app
        run: pnpm --filter desktop tauri build --target ${{ matrix.rust }} --bundles ${{ matrix.bundles }} --config "{\"version\":\"${TAG#v}\"}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="apps/desktop/src-tauri/target/${{ matrix.rust }}/release/bundle"
          N="my-local-office-${{ matrix.target }}"
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            tar -czf "out/$N.app.tar.gz" -C "$B/macos" "My Local Office.app"
            mv "$B"/dmg/*.dmg "out/$N.dmg"
          else
            mv "$B"/appimage/*.AppImage "out/$N.AppImage"
            mv "$B"/deb/*.deb "out/$N.deb"
          fi
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    needs: [build, desktop]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: printf 'MLO_HOME=%s\nMLO_APP_PATH=%s\n' "$RUNNER_TEMP/mlo" "$RUNNER_TEMP/My Local Office.app" >>"$GITHUB_ENV"
      # macOS installs the app; Linux runners have no display, so install.sh picks the headless package.
      - name: Install the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p install.sh -D "$RUNNER_TEMP"
          bash "$RUNNER_TEMP/install.sh" --version "$TAG" --no-start
      - name: Start and check
        run: |
          if [ "$RUNNER_OS" = macOS ]; then APP="$MLO_APP_PATH/Contents/Resources/app"; codesign --verify --strict "$MLO_APP_PATH"; else APP="$MLO_HOME/app"; fi
          "$APP/scripts/start.sh" > "$RUNNER_TEMP/office.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4410/api/state -o "$RUNNER_TEMP/state.json" && break; sleep 1; done
          cat "$RUNNER_TEMP/office.log"
          grep -q "\"version\":\"${TAG#v}\"" "$RUNNER_TEMP/state.json"
          curl -sf http://127.0.0.1:4410/ | grep -q '<div id="root">'
          test -f "$MLO_HOME/data/office.db"
          echo "My Local Office ${TAG#v} installed and running on ${{ matrix.os }}"
